[package]
name = "rex-picker"
version = "0.1.0"
edition = "2024"
description = "A fast, reusable terminal picker for Rex workflows"
license = "MIT"
rust-version = "1.88"

[lib]
name = "rex_picker"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
nucleo = "0.5.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.3"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3.27.0"

[[bench]]
name = "matching"
harness = false

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
